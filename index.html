<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lavagna</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lavagna">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ECEFEE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#181B1F" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEFEE; --surface:#FFFFFF; --sunk:#E2E6E5; --ink:#1C2126; --muted:#5B646D; --line:#D2D8DA;
  --red:#D2322D; --blue:#2360B5; --yellow:#E2AE17; --green:#2B9450; --white:#F4F4F2; --steel:#8E979F;
  --focus:#2360B5;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#181B1F; --surface:#22262B; --sunk:#1D2125; --ink:#E8EBED; --muted:#98A1AA; --line:#343A41;
    --white:#DCDDDA; --steel:#6E7780; --focus:#6FA2EC; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#181B1F; --surface:#22262B; --sunk:#1D2125; --ink:#E8EBED; --muted:#98A1AA; --line:#343A41;
  --white:#DCDDDA; --steel:#6E7780; --focus:#6FA2EC; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Barlow,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3,.cond{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif}
h1{font-weight:800;font-size:2.4rem;line-height:1;margin:0;letter-spacing:-.01em}
h2{font-weight:700;font-size:1.5rem;line-height:1.1;margin:0 0 .6rem}
h3{font-weight:700;font-size:1.15rem;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:1.1rem 1rem calc(96px + env(safe-area-inset-bottom,0px))}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;margin-bottom:1.2rem}
.sub{color:var(--muted);font-size:.92rem}
.status{font-size:.8rem;color:var(--muted);text-align:right}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1rem;margin-bottom:.8rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.6rem .9rem;font-weight:600;cursor:pointer;min-height:44px}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.wide{width:100%}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:.5rem;align-items:center}
.row.wrapr{flex-wrap:wrap}
.grow{flex:1;min-width:0}
label.f{display:block;font-size:.82rem;color:var(--muted);margin:.6rem 0 .25rem}
input,select,textarea{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:.55rem .65rem;min-height:42px}
textarea{min-height:120px;resize:vertical}
.num{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:700;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:2rem 1rem;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:"Barlow Condensed",Arial,sans-serif;font-size:1.4rem;margin-bottom:.3rem}

/* Diario */
.sess{padding:.7rem .9rem;margin-bottom:.5rem}
.sess-head{display:flex;justify-content:space-between;align-items:center;gap:.6rem;cursor:pointer}
.sess-date{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:600;font-size:1rem;color:var(--muted);flex:none;min-width:4.4rem}
.sess-title{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:700;font-size:1.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess .chev{color:var(--muted);font-size:.9rem;transition:transform .15s}
.sess.open .chev{transform:rotate(180deg)}
.sess-detail{display:none;margin-top:.5rem}
.sess.open .sess-detail{display:block}
.tag{display:inline-block;font-size:.78rem;padding:.12rem .5rem;border-radius:999px;background:var(--sunk);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.board{margin-top:.6rem;font-family:"Barlow Condensed",Arial,sans-serif;font-size:1.08rem;line-height:1.3}
.board .bt{font-weight:700}
.board .br{color:var(--muted);padding-left:.9rem}
.board .res{padding-left:.9rem;font-weight:600}
.sess-actions{display:none;gap:.5rem;margin-top:.8rem;flex-wrap:wrap}
.sess.open .sess-actions{display:flex}
.review{display:none;margin-top:.8rem;border-top:1px dashed var(--line);padding-top:.7rem;font-size:.95rem}
.sess.open .review{display:block}
.month{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:600;color:var(--muted);margin:1.2rem 0 .5rem;font-size:1rem}

/* Massimali */
.bar-hero{padding:1rem 1rem .8rem}
.kg-big{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:800;font-size:3.6rem;line-height:.9}
.kg-big small{font-size:1.3rem;font-weight:600;color:var(--muted);margin-left:.15rem}
.zone{display:inline-flex;align-items:center;gap:.35rem;font-size:.85rem;font-weight:600}
.dot{width:.7rem;height:.7rem;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.15)}
.barbell{width:100%;height:auto;display:block;margin:.6rem 0 .3rem}
.perside{font-size:.9rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:.35rem .7rem;align-items:center}
input[type=range]{padding:0;background:transparent;border:0;min-height:36px;accent-color:var(--ink)}
.maxrow{display:flex;align-items:center;gap:.8rem;padding:.75rem 0;border-top:1px solid var(--line);cursor:pointer}
.maxrow:first-child{border-top:0}
.maxrow .name{font-weight:600}
.maxrow .rm{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:700;font-size:1.5rem;min-width:4.5rem;text-align:right}
.chips{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.2rem}
.chip{font-size:.78rem;padding:.08rem .45rem;border-radius:6px;border-left:4px solid var(--steel);background:var(--sunk)}
table.pct{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.pct td{padding:.35rem .3rem;border-top:1px solid var(--line)}
table.pct td:last-child{text-align:right;font-family:"Barlow Condensed",Arial,sans-serif;font-weight:700;font-size:1.1rem}
.note{font-size:.8rem;color:var(--muted);margin-top:.5rem}

/* Valuta */
.out{font-size:.97rem}
.out p{margin:.4rem 0}
.out ul{margin:.3rem 0 .6rem;padding-left:1.2rem}
.out li{margin:.2rem 0}

/* Progressi */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-bottom:.8rem}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.7rem}
.stat .v{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:800;font-size:1.9rem;line-height:1}
.stat .l{font-size:.78rem;color:var(--muted)}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font:12px Barlow,Arial,sans-serif}

/* Nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.tabs .in{display:flex;width:100%;max-width:640px}
nav.tabs button{flex:1;background:none;border:0;padding:.55rem .2rem .6rem;min-height:56px;display:flex;flex-direction:column;align-items:center;gap:.15rem;color:var(--muted);font-size:.78rem;font-weight:600;cursor:pointer}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] .pip{background:var(--red)}
.pip{width:22px;height:3px;border-radius:2px;background:transparent;margin-bottom:.1rem}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,14,.45);z-index:40;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:18px 18px 0 0;max-height:92%;overflow:auto;transform:translateY(100%);transition:transform .22s ease;padding:0 0 calc(1rem + env(safe-area-inset-bottom,0px))}
.sheet.on{transform:none}
.sheet .sh-head{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:.9rem 1rem .6rem;border-bottom:1px solid var(--line);z-index:2}
.sheet .sh-body{padding:.6rem 1rem 1rem;max-width:640px;margin:0 auto}
.block{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.8rem;margin:.8rem 0}
.exrow{border-top:1px dashed var(--line);padding-top:.55rem;margin-top:.55rem}
.exrow .g{display:grid;grid-template-columns:1.1fr 1fr 4.2rem 2.6rem;gap:.4rem;margin-top:.4rem}
.exrow .lbl{font-size:.74rem;font-weight:600;color:var(--muted);margin-top:.5rem}
.exrow .lbl.done{color:var(--ink)}
.g3{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-top:.4rem}
.cmp{display:grid;grid-template-columns:1fr 1fr;column-gap:.9rem;row-gap:.2rem}
.cmp .ch{font-family:Barlow,Arial,sans-serif;font-size:.74rem;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:.15rem}
.cmp .bt-row,.cmp .res{grid-column:1/-1}
.cmp .bt-row{margin-top:.45rem}
.cmp .res{padding-left:0;margin-top:.1rem}
.cmp .cl{color:var(--muted)}
.cmp .cr.same{color:var(--green);font-weight:700}
.cmp .cr.diff{font-weight:600;border-left:3px solid var(--yellow);padding-left:.4rem}
.calc{font-size:.82rem;color:var(--muted);min-height:1.1em;margin-top:.25rem}
.iconbtn{background:none;border:1px solid var(--line);border-radius:9px;min-width:42px;min-height:42px;cursor:pointer;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.55rem .9rem;border-radius:10px;font-size:.9rem;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.on{opacity:1}
.ago{font-size:.84rem;color:var(--muted);display:flex;align-items:center;gap:.35rem;margin-top:.15rem;flex-wrap:wrap}
.ago strong{color:var(--ink);font-weight:600}
.legend{font-size:.78rem;color:var(--muted);display:flex;gap:.8rem;flex-wrap:wrap;margin:.1rem 0 .4rem}
.legend span{display:inline-flex;align-items:center;gap:.3rem}
.g2{display:grid;grid-template-columns:1fr 5.6rem;gap:.4rem;margin-top:.4rem}
.tag.rx{background:var(--green);border-color:var(--green);color:#fff}
.tag.pr{border-color:var(--red);color:var(--red)}
.hs{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:700;font-size:1.3rem;line-height:1.1}
.hrow{display:flex;gap:.6rem;align-items:flex-start;border-top:1px solid var(--line);padding:.6rem 0}
.thumbs{display:flex;gap:.4rem;overflow-x:auto;margin:.6rem 0 .2rem}
.thumbs img{height:64px;width:auto;max-width:100%;border-radius:8px;border:1px solid var(--line);flex:none;background:var(--sunk)}
.sess.open .thumbs img,.sh-body .thumbs img{height:200px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:sp 1s linear infinite;margin:1rem auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}.spin{animation-duration:3s}}
</style>
</head>

  <header class="top">
    <div>

    <button data-tab="valuta"><span class="pip"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>Valuta</button>
    <button data-tab="progressi"><span class="pip"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5M4 19h16"/><path d="M8 15l4-4 3 3 5-6"/></svg>Progressi</button>

</nav>

<div class="scrim" id="scrim"></div>

/* ---------- Storage ---------- */
const Store={
  mode:'local',q:Promise.resolve(),
  loadLocal(){try{const raw=localStorage.getItem(LS);if(raw){const d=JSON.parse(raw);S.maxes=d.maxes||[];S.bar=d.bar||20;S.round=d.round||2;S.sessions=d.sessions||[];S.heroes=d.heroes||[];S.heroDefs=d.heroDefs||[]}}catch(e){}},
  saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}},
  async connect(){
    if(!window.claude||typeof window.claude.use!=='function')return;
    try{
      const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      if(!db||!user)return;
      const id=await user.id(); if(!id)return;
      const localMaxes=clone(S.maxes), localSessions=clone(S.sessions), localHeroes=clone(S.heroes);
      this.maxRef=db.doc('data/users/'+id+'/maxes');
      this.sesCol=db.doc('data/users/'+id+'/profile').collection('sessions');
      this.heroCol=db.doc('data/users/'+id+'/profile').collection('heroes');
      this.mode='cloud'; setStatus();
      let firstM=true, firstS=true;
      this.maxRef.onSnapshot(snap=>{
        const d=snap.exists?snap.data():null;
        if(d){S.maxes=clone(d.items||[]);S.bar=d.bar||20;S.round=d.round||2;S.heroDefs=clone(d.heroDefs||[]);this.saveLocal()}
        else if(firstM&&localMaxes.length){S.maxes=localMaxes;this.saveMaxes()}
        firstM=false; render();
      },e=>this.fail(e));
      this.sesCol.onSnapshot(snap=>{
        if(firstS&&snap.empty&&localSessions.length&&!snap.metadata.fromCache){
          firstS=false; localSessions.forEach(s=>this.saveSession(s)); return;
        }
        if(!snap.metadata.fromCache)firstS=false;
        S.sessions=snap.docs.map(d=>clone(d.data()));
        this.saveLocal(); render();
      },e=>this.fail(e));
      let firstH=true;
      this.heroCol.onSnapshot(snap=>{
        if(firstH&&snap.empty&&localHeroes.length&&!snap.metadata.fromCache){firstH=false;localHeroes.forEach(a=>this.saveHero(a));return}
        if(!snap.metadata.fromCache)firstH=false;
        S.heroes=snap.docs.map(d=>clone(d.data()));
        this.saveLocal(); render();
      },e=>this.fail(e));
    }catch(e){}
  },
  fail(){this.mode='local';setStatus();toast('Sincronizzazione interrotta: i dati restano su questo dispositivo.')},
  saveMaxes(){
    this.saveLocal(); if(this.mode!=='cloud')return;
    const body={items:clone(S.maxes),bar:S.bar,round:S.round,heroDefs:clone(S.heroDefs)};
    this.q=this.q.then(()=>this.maxRef.set(body)).catch(e=>toast(e&&e.code==='quota_exceeded'?'Spazio esaurito: elimina dati vecchi.':'Massimali non sincronizzati, riprova.'));
  },
  saveSession(s){
    this.saveLocal(); if(this.mode!=='cloud')return;
    return this.sesCol.doc(s.id).set(clone(s)).catch(e=>toast(e&&e.code==='quota_exceeded'?'Spazio esaurito: elimina sessioni vecchie.':'Sessione non sincronizzata, riprova.'));
  },
  deleteSession(id){
    this.saveLocal(); if(this.mode!=='cloud')return;
    this.sesCol.doc(id).delete().catch(()=>toast('Eliminazione non sincronizzata, riprova.'));
  },
  saveHero(a){
    this.saveLocal(); if(this.mode!=='cloud')return;
    return this.heroCol.doc(a.id).set(clone(a)).catch(()=>toast('Risultato non sincronizzato, riprova.'));
  },
  deleteHero(id){
    this.saveLocal(); if(this.mode!=='cloud')return;
    this.heroCol.doc(id).delete().catch(()=>toast('Eliminazione non sincronizzata, riprova.'));
  }
};
function setStatus(){$('#status').textContent=Store.mode==='cloud'?'Sincronizzato col tuo account':'Dati su questo dispositivo'}

/* ---------- Helpers ---------- */
function platesFor(total){const per=(total-S.bar)/2;if(per<0)return null;let r=Math.round(per*2)/2;const out=[];for(const p of PLATES){while(r>=p-1e-9){out.push(p);r=+(r-p).toFixed(2)}}return out}
function barbellSVG(pl){
  const W=340,cx=170,y=58;
  let s=`<svg class="barbell" viewBox="0 0 ${W} 116" role="img" aria-label="Bilanciere caricato">`;
  s+=`<rect x="8" y="${y-2}" width="${W-16}" height="4" rx="2" fill="var(--steel)"/>`;
  s+=`<rect x="${cx-150}" y="${y-5}" width="78" height="10" rx="3" fill="var(--steel)"/><rect x="${cx+72}" y="${y-5}" width="78" height="10" rx="3" fill="var(--steel)"/>`;
  s+=`<rect x="${cx-74}" y="${y-11}" width="5" height="22" rx="1.5" fill="var(--steel)"/><rect x="${cx+69}" y="${y-11}" width="5" height="22" rx="1.5" fill="var(--steel)"/>`;
  if(pl&&pl.length){
    const sum=pl.reduce((a,p)=>a+PW[p]+1,0), k=Math.min(1,76/sum);
    let off=0;
    pl.forEach(p=>{
      const w=PW[p]*k,h=PH[p],col=`var(${PCOL[p]})`;
      const xr=cx+70+off, xl=cx-70-off-w;
      [xl,xr].forEach(x=>{s+=`<rect x="${x.toFixed(1)}" y="${y-h/2}" width="${w.toFixed(1)}" height="${h}" rx="2" fill="${col}" stroke="rgba(0,0,0,.25)" stroke-width=".6"/>`});
      off+=w+1*k;
    });
  }
  return s+'</svg>';
}
function sessionText(s){
  const L=[`${dIT(s.date)} – ${s.type||'Sessione'}${s.rpe?` – RPE ${s.rpe}`:''}${s.duration?` – ${s.duration}'`:''}`];
  (s.blocks||[]).forEach(b=>{
    L.push(`  ${b.name||'Blocco'}: ${b.format||''}${b.dur?` ${b.dur}'`:''}`);
    (b.rows||[]).forEach(r=>{L.push('    '+rowLine(r))});
    if(b.result)L.push(`    Risultato: ${b.result}`);
  });
  if(s.notes)L.push('  Note: '+s.notes);
  return L.join('\n');
}
function loadKg(r){
  if(r.unit==='%'){const m=findMax(r.ex);if(m&&m.rm&&r.load!==''&&r.load!=null)return roundTo(m.rm*Number(r.load)/100);return null}
  return (r.load===''||r.load==null)?null:Number(r.load);
}
function loadLabel(r){
  if(r.load===''||r.load==null)return'';
  if(r.unit==='%'){const kg=loadKg(r);return `${fmt(r.load)}%${kg!=null?` (${fmt(kg)} kg)`:''}`}
  return `${fmt(r.load)} kg`;
}
function refreshDatalist(){
  const names=[...new Set([...S.maxes.map(m=>m.name),...COMMON])];
  $('#exlist').innerHTML=names.map(n=>`<option value="${esc(n)}">`).join('');
}
function md(text){
  const lines=esc(text).split('\n');let html='',inList=false;
  lines.forEach(l=>{
    let t=l.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    const li=t.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)$/);
    if(li){if(!inList){html+='<ul>';inList=true}html+=`<li>${li[1]}</li>`;return}
    if(inList){html+='</ul>';inList=false}
    const h=t.match(/^#{1,4}\s+(.*)$/);
    if(h){html+=`<p><strong>${h[1]}</strong></p>`;return}
    if(t.trim())html+=`<p>${t}</p>`;
  });
  if(inList)html+='</ul>';return html;
}

function dShort(iso){if(!iso)return '';const d=new Date(iso+'T12:00:00');return d.toLocaleDateString('it-IT',{weekday:'short'}).replace('.','')+' '+iso.slice(8,10)+'/'+iso.slice(5,7)}
function sessTitle(s){
  if(s.hero){const d=heroDefs().find(x=>x.k===s.hero);if(d)return d.n}
  const bl=(s.blocks||[]).filter(b=>!/riscald|warm/i.test(b.name||''));
  const rowsOf=b=>(b.rows||[]).filter(r=>r.ex&&!/^\s*rest\s*$/i.test(r.ex)&&!/:\s*$/.test(r.ex));
  const pick=b=>{const rs=rowsOf(b);if(!rs.length)return '';const w=rs.find(r=>r.unit==='%'||+(r.rxLoad||r.load)>0);return (w||rs[0]).ex};
  const fz=bl.find(b=>/forza|strength|\bstr\b|pesistica|weightlifting|sollev/i.test(b.name||''))||bl.find(b=>b.format==='Serie × ripetizioni');
  if(fz){const t=pick(fz);if(t)return t}
  for(const b of bl){const t=pick(b);if(t)return t}
  return s.type||'Allenamento';
}
function confirmTap(el,msg){
  if(el.dataset.armed&&Date.now()-+el.dataset.armed<4000){delete el.dataset.armed;return true}
  el.dataset.armed=Date.now();const old=el.textContent;el.textContent=msg||'Tocca di nuovo per confermare';

}

    </select>

}

function renderProgressi(){
  const ss=S.sessions;
  if(!ss.length&&!S.maxes.some(m=>(m.history||[]).length))return `<div class="empty"><strong>Ancora nessun dato</strong>Registra allenamenti e massimali: qui vedrai frequenza, distribuzione e andamento degli 1RM.</div>`;
  const now=new Date(todayISO()+'T12:00:00'), day=864e5;
  const last30=ss.filter(s=>(now-new Date(s.date+'T12:00:00'))/day<30);
  const rpes=last30.map(s=>+s.rpe).filter(Boolean);
  let h=`<div class="stats">
    <div class="stat"><div class="v">${last30.length}</div><div class="l">sessioni in 30 giorni</div></div>
    <div class="stat"><div class="v">${fmt(last30.length/30*7)}</div><div class="l">a settimana, media</div></div>
    <div class="stat"><div class="v">${rpes.length?fmt(rpes.reduce((a,b)=>a+b,0)/rpes.length):'—'}</div><div class="l">RPE medio</div></div></div>`;
  // weekly bars (Monday-based)
  const mon=new Date(now);mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
  const weeks=[];for(let i=7;i>=0;i--){const st=new Date(mon-i*7*day);weeks.push({st,n:0})}
  ss.forEach(s=>{const d=new Date(s.date+'T12:00:00');weeks.forEach(w=>{if(d>=w.st&&d<new Date(+w.st+7*day))w.n++})});
  const mx=Math.max(4,...weeks.map(w=>w.n)),W=340,H=150,bw=W/8;
  let svg=`<svg class="chart" viewBox="0 0 ${W} ${H+22}">`;
  weeks.forEach((w,i)=>{const bh=w.n/mx*H;svg+=`<rect x="${i*bw+6}" y="${H-bh}" width="${bw-12}" height="${Math.max(bh,1)}" rx="3" fill="var(${i===7?'--red':'--ink'})" opacity="${i===7?1:.75}"/>`;
    if(w.n)svg+=`<text x="${i*bw+bw/2}" y="${H-bh-5}" text-anchor="middle">${w.n}</text>`;
    svg+=`<text x="${i*bw+bw/2}" y="${H+16}" text-anchor="middle">${w.st.getDate()}/${w.st.getMonth()+1}</text>`});
  h+=`<div class="card"><h2>Sessioni per settimana</h2>${svg}</svg></div>`;
  // types
  if(last30.length){
    const c={};last30.forEach(s=>c[s.type||'Altro']=(c[s.type||'Altro']||0)+1);
    const tot=last30.length;
    h+=`<div class="card"><h2>Distribuzione, ultimi 30 giorni</h2>${Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`
      <div style="margin:.45rem 0"><div class="row" style="justify-content:space-between"><span>${esc(k)}</span><span class="num">${v}</span></div>
      <div style="height:8px;background:var(--sunk);border-radius:4px;margin-top:.2rem"><div style="height:8px;width:${v/tot*100}%;background:var(--blue);border-radius:4px"></div></div></div>`).join('')}</div>`;
  }
  // 1RM history
  const hm=S.maxes.filter(m=>(m.history||[]).length);
  if(hm.length){
    if(!UI.progEx||!hm.find(m=>m.id===UI.progEx))UI.progEx=hm[0].id;
    const m=hm.find(x=>x.id===UI.progEx), pts=[...m.history].sort((a,b)=>a.date.localeCompare(b.date));
    h+=`<div class="card"><h2>Andamento 1RM</h2><select id="progEx">${hm.map(x=>`<option value="${x.id}" ${x.id===m.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>${lineChart(pts)}
      ${pts.length>1?`<div class="sub">Da ${fmt(pts[0].rm)} a ${fmt(pts[pts.length-1].rm)} kg (${pts[pts.length-1].rm>=pts[0].rm?'+':''}${fmt((pts[pts.length-1].rm/pts[0].rm-1)*100)}%)</div>`:'<div class="sub">Aggiorna l’1RM nel tempo per vedere la curva.</div>'}</div>`;
  }
  return h;
}
function lineChart(pts){
  const W=340,H=150,p=28;
  const ys=pts.map(x=>x.rm),mn=Math.min(...ys)*0.95,mxv=Math.max(...ys)*1.05||1;
  const X=i=>pts.length===1?W/2:p+i*(W-2*p)/(pts.length-1), Y=v=>H-((v-mn)/(mxv-mn||1))*(H-20)-6;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H+20}" style="margin-top:.6rem">`;
  s+=`<polyline fill="none" stroke="var(--red)" stroke-width="2.5" points="${pts.map((x,i)=>X(i)+','+Y(x.rm)).join(' ')}"/>`;
  pts.forEach((x,i)=>{s+=`<circle cx="${X(i)}" cy="${Y(x.rm)}" r="4" fill="var(--surface)" stroke="var(--red)" stroke-width="2"/>`;
    if(pts.length<=8||i===0||i===pts.length-1){s+=`<text x="${X(i)}" y="${Y(x.rm)-9}" text-anchor="middle">${fmt(x.rm)}</text><text x="${X(i)}" y="${H+16}" text-anchor="middle">${x.date.slice(8,10)}/${x.date.slice(5,7)}</text>`}});
  return s+'</svg>';
}

/* ---------- Tempo trascorso ---------- */
const daysSince=iso=>Math.round((new Date(todayISO()+'T12:00:00')-new Date(iso+'T12:00:00'))/864e5);
function agoText(iso){
  if(!iso)return '';const d=daysSince(iso);
  if(d<=0)return 'oggi';if(d===1)return 'ieri';if(d<14)return d+' giorni fa';if(d<60)return Math.round(d/7)+' settimane fa';
  const mo=Math.floor(d/30.44);if(mo<12)return mo===1?'1 mese fa':mo+' mesi fa';
  const y=Math.floor(mo/12),m=mo%12;return (y===1?'1 anno':y+' anni')+(m?' e '+m+(m===1?' mese':' mesi'):'')+' fa';
}
const ageColor=iso=>{const d=daysSince(iso);return d>365?'--red':d>182?'--yellow':'--green'};
function agoHTML(iso,label){
  if(!iso)return '<div class="ago"><span class="dot" style="background:var(--steel)"></span>Data non registrata</div>';
  return `<div class="ago"><span class="dot" style="background:var(${ageColor(iso)})"></span>${label?label+' ':''}${dIT(iso)}, <strong>${agoText(iso)}</strong></div>`;
}
const legendHTML=`<div class="legend"><span><span class="dot" style="background:var(--green)"></span>meno di 6 mesi</span><span><span class="dot" style="background:var(--yellow)"></span>6–12 mesi</span><span><span class="dot" style="background:var(--red)"></span>oltre un anno</span></div>`;
const maxDate=m=>(m.history||[]).map(h=>h.date).filter(Boolean).sort().pop()||'';
const lastDated=list=>list.map(a=>a.date).filter(Boolean).sort().pop()||'';

/* ---------- Scaling ---------- */
function regOptions(ex){const k=String(ex||'').trim().toLowerCase();return [...(REG[k]||[]),'Carico ridotto','Altro…']}
function doneLabel(r){return r.done==='Altro…'?(r.doneNote||'variante'):r.done}
function rxDiff(r){return r.rxLoad!==''&&r.rxLoad!=null&&!isNaN(+r.rxLoad)&&r.load!==''&&r.load!=null&&+r.rxLoad!==+r.load}
function isScaled(r){return !!r.done||(rxDiff(r)&&+r.load<+r.rxLoad)||!!(r.repsDone&&r.repsDone!==r.reps)}
function unitTxt(v,r){
  if(v===''||v==null||isNaN(+v))return '';
  if(r.unit==='%'){const m=findMax(r.ex),kg=m&&m.rm?roundTo(m.rm*+v/100):null;return `${fmt(+v)}%${kg!=null?` (${fmt(kg)} kg)`:''}`}
  return fmt(+v)+' kg';
}
function boardSide(r){const rx=(r.rxLoad!==''&&r.rxLoad!=null)?r.rxLoad:r.load,u=unitTxt(rx,r);return [r.reps,r.ex].filter(Boolean).join(' ')+(u?' @ '+u:'')}
function doneSide(r){
  const repsCh=!!(r.repsDone&&r.repsDone!==r.reps),loadCh=rxDiff(r);
  if(!r.done&&!repsCh&&!loadCh)return null;
  const ex=r.done&&r.done!=='Carico ridotto'?doneLabel(r):r.ex,v=(r.load!==''&&r.load!=null)?r.load:r.rxLoad,u=unitTxt(v,r);
  return [repsCh?r.repsDone:r.reps,ex].filter(Boolean).join(' ')+(u?' @ '+u:'');
}
function rowLine(r){const d=doneSide(r);return boardSide(r)+(d?' → fatto: '+d:'')}
function rowLineOld(r){return [r.reps,r.ex].filter(Boolean).join(' ')+(r.done?' → '+doneLabel(r):'')+(loadLabel(r)?' @ '+loadLabel(r):'')+(rxDiff(r)?` (RX ${fmt(r.rxLoad)}${r.unit==='%'?'%':' kg'})`:'')}
function rxTag(s){const rows=(s.blocks||[]).flatMap(b=>b.rows||[]);if(rows.some(isScaled))return '<span class="tag">Scaled</span>';if(rows.some(r=>r.rxLoad!==''&&r.rxLoad!=null)||rows.some(r=>'done' in r))return '<span class="tag rx">RX</span>';return ''}
function doneHTML(r){
  const opts=regOptions(r.ex),cur=r.done||'';
  const list=cur&&!opts.includes(cur)?[...opts.slice(0,-1),cur,'Altro…']:opts;
  return `<select data-rf="done" aria-label="Esercizio eseguito" style="margin-top:.4rem"><option value="" ${!cur?'selected':''}>Esercizio come scritto</option>${list.map(o=>`<option ${o===cur?'selected':''}>${esc(o)}</option>`).join('')}</select>${cur==='Altro…'?`<input data-rf="doneNote" style="margin-top:.4rem" value="${esc(r.doneNote||'')}" placeholder="Cosa hai fatto al posto dell’esercizio" aria-label="Variante eseguita">`:''}
  <div class="g3"><input data-rf="repsDone" value="${esc(r.repsDone||'')}" placeholder="Rip. fatte${r.reps?' ('+esc(r.reps)+')':''}" aria-label="Ripetizioni fatte"><input data-rf="load" inputmode="decimal" value="${esc(r.load==null?'':r.load)}" placeholder="Tuo carico" aria-label="Il tuo carico"></div>`;
}

/* ---------- Hero WOD ---------- */
const heroDefs=()=>[...HEROES,...S.heroDefs];
const heroAtts=k=>S.heroes.filter(a=>a.k===k).sort((a,b)=>b.date.localeCompare(a.date)||(b.created||0)-(a.created||0));
function better(d,a,b){if(d.s==='time')return a.secs<b.secs;if(d.s==='rounds')return a.r>b.r||(a.r===b.r&&a.reps>b.reps);return a.n>b.n}
function best(d,list){let pool=list.filter(a=>a.rx),tag='RX';if(!pool.length){pool=list;tag='scaled'}let b=null;pool.forEach(a=>{if(!b||better(d,a,b))b=a});return b?{a:b,tag}:null}
function secsLabel(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=Math.round(s%60);return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')}
function parseTime(t){const p=String(t||'').trim().split(/[:.,']+/).filter(x=>x!=='').map(Number);if(!p.length||p.some(isNaN))return null;if(p.length===1)return p[0]>0?p[0]*60:null;let s=0;p.forEach(v=>s=s*60+v);return s>0?s:null}
function scoreLabel(d,a){if(d.s==='time')return secsLabel(a.secs);if(d.s==='rounds')return `${a.r} round${a.reps?' + '+a.reps:''}`;return `${a.n} rip.`}
const fmtLabel=d=>d.f==='AMRAP'?`AMRAP ${d.d||''}′`:d.f;
function renderHero(){
  const defs=heroDefs(),done=defs.filter(d=>heroAtts(d.k).length),rest=defs.filter(d=>!heroAtts(d.k).length);
  const item=d=>{const at=heroAtts(d.k),b=best(d,at);return `<div class="maxrow" data-act="hero-open" data-k="${esc(d.k)}"><div class="grow"><div class="name">${esc(d.n)}</div><div class="sub">${esc(fmtLabel(d))}: ${esc(d.l.filter(x=>!/:$/.test(x)).slice(0,3).join(', '))}${d.l.length>3?'…':''}</div>${at.length?agoHTML(lastDated(at),'Ultima volta'):''}</div><div style="text-align:right">${b?`<div class="hs">${esc(scoreLabel(d,b.a))}</div><div class="sub">${b.tag}, ${at.length} ${at.length===1?'volta':'volte'}</div>`:'<div class="sub">Da fare</div>'}</div></div>`};
  let h=`<div class="card"><h2>Hero WOD</h2><p class="sub" style="margin:0">Registra tempo o round di ogni tentativo, RX o scaled: vedi record e miglioramenti nel tempo.</p></div>`;
  done.sort((a,b)=>(lastDated(heroAtts(a.k))||'9').localeCompare(lastDated(heroAtts(b.k))||'9'));
  if(done.length)h+=`<div class="card"><h3 style="margin-bottom:.2rem">I tuoi risultati</h3><div class="sub" style="margin-bottom:.2rem">Dal più lontano nel tempo</div>${legendHTML}${done.map(item).join('')}</div>`;
  h+=`<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:.2rem"><h3>${done.length?'Ancora da fare':'Catalogo'}</h3><button class="btn" data-act="hero-new-def">Aggiungi un WOD</button></div>${rest.map(item).join('')||'<div class="sub">Li hai fatti tutti.</div>'}</div>`;
  return h+`<div class="note" style="padding:0 .2rem">Hero WOD pubblicati da CrossFit.com. Carichi convertiti dalle libbre e arrotondati al kg.</div>`;
}
function openHero(k){
  const d=heroDefs().find(x=>x.k===k);if(!d)return;
  const at=heroAtts(k),b=best(d,at),asc=[...at].reverse();
  draft={kind:'hero',k};
  const score=d.s==='time'?`<label class="f" for="h-time">Tempo (mm:ss)</label><input id="h-time" inputmode="decimal" placeholder="38:45 oppure 38.45">`
    :d.s==='rounds'?`<div class="row"><div class="grow"><label class="f" for="h-r">Round completi</label><input id="h-r" inputmode="numeric"></div><div class="grow"><label class="f" for="h-reps">Ripetizioni extra</label><input id="h-reps" inputmode="numeric" placeholder="0"></div></div>`
    :`<label class="f" for="h-n">Ripetizioni totali</label><input id="h-n" inputmode="numeric">`;
  const hist=at.map(a=>{const i=asc.indexOf(a),p=i>0?asc[i-1]:null;let delta='';
    if(p&&d.s==='time'){const df=p.secs-a.secs;delta=df?`${df>0?'−':'+'}${secsLabel(Math.abs(df))} sul precedente`:'pari al precedente'}
    if(p&&d.s==='reps'){const df=a.n-p.n;delta=`${df>0?'+':''}${df} sul precedente`}
    if(p&&d.s==='rounds'){delta=better(d,a,p)?'meglio del precedente':better(d,p,a)?'sotto il precedente':'pari al precedente'}
    return `<div class="hrow"><div class="grow"><div class="row" style="gap:.4rem;flex-wrap:wrap"><span class="hs">${esc(scoreLabel(d,a))}</span><span class="tag ${a.rx?'rx':''}">${a.rx?'RX':'Scaled'}</span>${b&&b.a===a?'<span class="tag pr">Record</span>':''}</div>
      <div class="sub">${a.date?dIT(a.date)+' ('+agoText(a.date)+')':'Data non registrata'}${delta?', '+delta:''}${a.scaled?'<br>Scaling: '+esc(a.scaled):''}${a.notes?'<br>'+esc(a.notes):''}</div></div><button class="iconbtn" data-act="del-hero-att" data-id="${a.id}" aria-label="Elimina risultato">✕</button></div>`}).join('');
  openSheet(`<div class="sh-head"><h3>${esc(d.n)}</h3><button class="btn ghost" data-act="close">Chiudi</button></div><div class="sh-body">
    <div class="card board" style="margin-top:.4rem"><div class="bt">${esc(fmtLabel(d))}</div>${d.l.map(x=>`<div class="br">${esc(x)}</div>`).join('')}${d.rx?`<div class="sub" style="font-family:Barlow,Arial,sans-serif;margin-top:.5rem">RX: ${esc(d.rx)}</div>`:''}</div>
    ${b?`<div style="margin:.2rem 0 .9rem"><div class="sub">Miglior risultato ${b.tag}</div><div class="kg-big" style="font-size:2.8rem">${esc(scoreLabel(d,b.a))}</div>${b.a.date?agoHTML(b.a.date,'Record del'):''}${agoHTML(lastDated(at),'Ultima volta')}</div>`:''}
    <div class="card"><h3>Registra un risultato</h3>
      <div class="row"><div class="grow"><label class="f" for="h-date">Data</label><input type="date" id="h-date" value="${todayISO()}"></div>
      <div class="grow"><label class="f" for="h-rx">Versione</label><select id="h-rx"><option value="rx">RX</option><option value="sc">Scaled</option></select></div></div>
      ${score}
      <label class="f" for="h-scaled">Cosa hai scalato</label><input id="h-scaled" placeholder="Es. ring row al posto dei pull-up, 50 kg invece di 70">
      <label class="f" for="h-notes">Note</label><input id="h-notes" placeholder="Partizione, sensazioni, strategia">
      <label class="row" style="margin-top:.8rem;gap:.5rem;font-size:.92rem"><input type="checkbox" id="h-diary" checked style="width:auto;min-height:0"> Aggiungi anche al diario</label>
      <button class="btn primary wide" style="margin-top:.8rem" data-act="save-hero-att">Salva risultato</button></div>
    ${hist?`<h3 style="margin-top:1.1rem">Storico</h3>${hist}`:''}
    ${d.k.startsWith('c_')?`<button class="btn danger ghost wide" style="margin-top:1rem" data-act="del-hero-def">Elimina questo WOD</button>`:''}
  </div>`);
}
function saveHeroAtt(){
  const d=heroDefs().find(x=>x.k===(draft&&draft.k));if(!d)return;
  const a={id:gid(),k:d.k,date:$('#h-date').value||todayISO(),rx:$('#h-rx').value==='rx',scaled:$('#h-scaled').value.trim(),notes:$('#h-notes').value.trim(),created:Date.now()};
  if(d.s==='time'){const s=parseTime($('#h-time').value);if(!s){toast('Inserisci il tempo come mm:ss.');return}a.secs=s}
  else if(d.s==='rounds'){const r=parseInt($('#h-r').value,10),x=parseInt($('#h-reps').value||'0',10);if(!(r>=0)||isNaN(x)){toast('Inserisci round e ripetizioni.');return}a.r=r;a.reps=x}
  else{const n=parseInt($('#h-n').value,10);if(!(n>0)){toast('Inserisci le ripetizioni.');return}a.n=n}
  const prev=best(d,heroAtts(d.k).filter(x=>x.rx===a.rx)),pr=prev&&prev.a&&better(d,a,prev.a);
  S.heroes.push(a);Store.saveHero(a);
  if($('#h-diary').checked){
    const s={id:gid(),created:Date.now(),date:a.date,type:'Circuito metabolico',duration:d.s==='rounds'?String(d.d||''):'',rpe:'',hero:d.k,
      notes:[a.scaled?'Scaling: '+a.scaled:'',a.notes].filter(Boolean).join('. '),
      blocks:[{name:d.n,format:d.f==='AMRAP'?'AMRAP':d.f==='For time'?'For time':'Libero',dur:d.s==='rounds'?String(d.d||''):'',result:scoreLabel(d,a)+(a.rx?' RX':' scaled'),rows:d.l.map(x=>({reps:'',ex:x,load:'',unit:'kg'}))}]};
    S.sessions.push(s);Store.saveSession(s);
  }
  render();openHero(d.k);toast(pr?`Nuovo record ${a.rx?'RX':'scaled'} su ${d.n}`:'Risultato salvato');
}
function openHeroDef(){

/* ---------- Sheet ---------- */
function openSheet(html){$('#sheet').dataset.kind='';$('#sheet').innerHTML=html;$('#scrim').classList.add('on');requestAnimationFrame(()=>$('#sheet').classList.add('on'))}

function calcHint(r){
  if(r.unit!=='%')return '';
  const m=findMax(r.ex);
  if(!m||!m.rm)return r.ex?'Nessun 1RM per questo esercizio: aggiungilo in Massimali.':'';
  const v=(r.load!==''&&r.load!=null)?r.load:r.rxLoad;if(v===''||v==null||isNaN(+v))return '';
  const kg=roundTo(m.rm*+v/100),kr=(r.rxLoad!==''&&r.rxLoad!=null&&!isNaN(+r.rxLoad))?roundTo(m.rm*+r.rxLoad/100):null;
  return `${kr!=null&&kr!==kg?`Lavagna ${fmt(kr)} kg, tu `:''}= ${fmt(kg)} kg (1RM ${fmt(m.rm)} kg)`;
}

- Struttura: riscaldamento specifico per il lavoro principale; durata e tempi realistici (es. un EMOM con troppe ripetizioni non lascia recupero nel minuto).

  UI.valBusy=true;UI.valOut='';render();

const str=v=>v==null?'':String(v).slice(0,300);
async function decode(file){
  if(window.createImageBitmap){try{return await createImageBitmap(file)}catch(e){}}
  return await new Promise((res,rej)=>{const u=URL.createObjectURL(file),img=new Image();img.onload=()=>{URL.revokeObjectURL(u);res(img)};img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('decode'))};img.src=u});
}
async function compress(file){
  const img=await decode(file),w=img.width||img.naturalWidth,h=img.height||img.naturalHeight;
  const draw=max=>{const k=Math.min(1,max/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c};
  const big=draw(1800),blob=await new Promise((res,rej)=>big.toBlob(b=>b?res(b):rej(new Error('encode')),'image/jpeg',0.82));
  return {blob,preview:draw(500).toDataURL('image/jpeg',0.7)};
}

function fromParsed(o){
  const d=newSession();d.blocks=[];
  if(o&&typeof o==='object'&&!Array.isArray(o)){
    if(/^\d{4}-\d{2}-\d{2}$/.test(o.date||''))d.date=o.date;
    if(TYPES.includes(o.type))d.type=o.type;
    if(o.duration)d.duration=str(o.duration);
    if(o.rpe&&+o.rpe>=1&&+o.rpe<=10)d.rpe=String(Math.round(+o.rpe));
    d.notes=str(o.notes);
    (Array.isArray(o.blocks)?o.blocks:[]).forEach(b=>{if(!b||typeof b!=='object')return;d.blocks.push({name:str(b.name)||'Blocco',format:FORMATS.includes(b.format)?b.format:'Libero',dur:str(b.dur),result:str(b.result),
      rows:(Array.isArray(b.rows)?b.rows:[]).filter(r=>r&&typeof r==='object').map(r=>({reps:str(r.reps),ex:str(r.ex),load:(r.load==null||r.load===''||isNaN(Number(r.load)))?'':String(Number(r.load)),rxLoad:(r.load==null||r.load===''||isNaN(Number(r.load)))?'':String(Number(r.load)),done:'',unit:r.unit==='%'?'%':'kg'}))})});
  }
  if(!d.blocks.length)d.blocks=[{name:'Parte principale',format:'Libero',dur:'',result:'',rows:[]}];
  d.blocks.forEach(b=>{if(!b.rows.length)b.rows=[{reps:'',ex:'',load:'',unit:'kg'}]});
  const letter=b=>{const m=String(b.name||'').match(/^\s*(?:punto\s*)?([A-Fa-f])(?:\s*[).:\-\u2013]|\s|$)/i);return m?m[1].toUpperCase():''};
  if(d.blocks.filter(letter).length>=2)d.blocks.sort((x,y)=>(letter(x)||'Z').localeCompare(letter(y)||'Z'));
  let wi=d.blocks.findIndex(b=>/riscald|warm|^\s*wu\b|mobilit|attivaz/i.test(b.name||''));
  if(wi<0)wi=d.blocks.findIndex(b=>letter(b)==='A');
  if(wi>0){const [w]=d.blocks.splice(wi,1);d.blocks.unshift(w)}
  if(wi>=0)d.blocks[0].name='Riscaldamento';
  return d;
}

async function exifDate(file){
  try{
    const buf=await file.slice(0,262144).arrayBuffer(),v=new DataView(buf);
    if(v.byteLength<4||v.getUint16(0)!==0xFFD8)return '';
    let o=2;
    while(o<v.byteLength-10){
      const mk=v.getUint16(o),len=v.getUint16(o+2);
      if((mk&0xFF00)!==0xFF00)break;
      if(mk===0xFFE1&&v.getUint32(o+4)===0x45786966){
        const t=o+10,le=v.getUint16(t)===0x4949,g16=p=>v.getUint16(p,le),g32=p=>v.getUint32(p,le);
        const str=(p,n)=>{let s='';for(let i=0;i<n&&p+i<v.byteLength;i++){const c=v.getUint8(p+i);if(!c)break;s+=String.fromCharCode(c)}return s};
        const find=(start,tag)=>{if(start+2>v.byteLength)return -1;const n=g16(start);for(let i=0;i<n;i++){const e=start+2+i*12;if(e+12>v.byteLength)break;if(g16(e)===tag)return e}return -1};
        const ifd0=t+g32(t+4);let dt='';
        const ex=find(ifd0,0x8769);
        if(ex>=0){const e=find(t+g32(ex+8),0x9003);if(e>=0)dt=str(t+g32(e+8),19)}
        if(!dt){const e=find(ifd0,0x0132);if(e>=0)dt=str(t+g32(e+8),19)}
        const m=dt.match(/^(\d{4}):(\d{2}):(\d{2})/);return m&&m[1]>'2000'?`${m[1]}-${m[2]}-${m[3]}`:'';
      }
      o+=2+len;
    }
  }catch(e){}
  return '';
}
function lmDate(file){
  if(!file.lastModified)return '';
  const d=new Date(file.lastModified);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
  const iso=d.toISOString().slice(0,10);return iso<todayISO()&&iso>'2010'?iso:'';
}

{"date":"YYYY-MM-DD o null","type":"uno tra: ${TYPES.join(' | ')}","duration":"minuti totali o null","rpe":null,"notes":"","blocks":[{"name":"es. Riscaldamento, Forza, WOD","format":"uno tra: ${FORMATS.join(' | ')}","dur":"minuti come stringa o vuoto","result":"punteggio, tempo, round o carico raggiunto se scritto","rows":[{"reps":"es. 5x5, 12, 400 m, 30 s","ex":"nome esercizio","load":carico RX scritto (numero) o null,"unit":"kg oppure %"}]}]}

async function importBatch(files){
  if(!apiKey()){openSettings(true);return}
  if(batch&&!batch.finished){renderBatch(true);return}
  let list=[...files];if(list.length>40){toast('Importo le prime 40 foto: le altre caricale in un secondo giro.');list=list.slice(0,40)}
  batch={items:list.map(f=>({file:f,status:'wait'})),ctl:new AbortController(),stopped:false,finished:false};
  renderBatch(true);
  for(const it of batch.items){
    if(batch.stopped){it.status='stop';continue}
    it.status='read';renderBatch();
    let tries=0;
    while(true){
      try{
        const hint=(await exifDate(it.file))||lmDate(it.file);
        const shot=await compress(it.file);it.preview=shot.preview;renderBatch();
        const res=await sampleFn.json(batchPrompt(hint),{images:[shot.blob],signal:batch.ctl.signal,modelTier:'default'});
        const s=fromParsed(res);delete s._isNew;
        const known=!!(res&&/^\d{4}-\d{2}-\d{2}$/.test(res.date||''));
        if(!known&&hint)s.date=hint;
        s.imported=true;
        if(!known&&!hint||/da verificare/i.test(s.notes||''))s.check=true;
        S.sessions.push(s);await Store.saveSession(s);
        it.status='ok';it.label=`${dIT(s.date)} – ${s.type}`;it.sub=(s.blocks||[]).map(b=>b.name).join(', ')+(s.check?' (da verificare)':'');
        renderBatch();
        if(assetsApi){try{const r=await assetsApi.upload(shot.blob);if(r&&r.id){const cur=clone(S.sessions.find(x=>x.id===s.id)||s);cur.photos=[r.id];const i=S.sessions.findIndex(x=>x.id===s.id);if(i>=0)S.sessions[i]=cur;await Store.saveSession(cur)}}catch(e){}}
        break;
      }catch(e){
        const c=e&&e.code;
        if(c==='cancelled'||batch.stopped){it.status='stop';it.preview=it.preview||'';break}
        if(c==='rate_limited'&&tries===0){tries++;it.sub='Troppe richieste: riprovo tra un minuto';renderBatch();await sleep(60000);if(batch.stopped){it.status='stop';break}continue}
        it.status='err';it.sub=c==='image_rejected'?'Immagine non accettata':c==='not_granted'?'Chiave API non valida o credito esaurito':'Lettura non riuscita';
        if(c==='not_granted'){batch.stopped=true}
        break;
      }
    }
    renderBatch();
  }
  batch.finished=true;renderBatch();render();
  const ok=batch.items.filter(i=>i.status==='ok').length;toast(`${ok} ${ok===1?'sessione importata':'sessioni importate'}`);
}

let idbP=null;
function idb(){if(!idbP)idbP=new Promise((res,rej)=>{const r=indexedDB.open('lavagna',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return idbP}
async function idbDo(mode,fn){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('photos',mode),st=tx.objectStore('photos');const rq=fn(st);tx.oncomplete=()=>res(rq&&rq.result);tx.onerror=()=>rej(tx.error)})}
const idbPut=(id,b)=>idbDo('readwrite',s=>s.put(b,id)), idbGet=id=>idbDo('readonly',s=>s.get(id)), idbDel=id=>idbDo('readwrite',s=>s.delete(id));

async function hydratePhotos(){

const blobToB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(b)});
const b64ToBlob=(s,type)=>{const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:type||'image/jpeg'})};

async function claudeSample(input,opts={}){
  const key=apiKey();if(!key)throw {code:'not_granted',message:'Chiave API mancante'};
  const imgs=opts.images?[].concat(opts.images instanceof FileList?[...opts.images]:opts.images):[];
  const content=[];
  for(const b of imgs)content.push({type:'image',source:{type:'base64',media_type:b.type||'image/jpeg',data:await blobToB64(b)}});
  content.push({type:'text',text:typeof input==='string'?input:input.map(t=>t.content).join('\n\n')});
  let res;
  try{
    res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:opts.signal,headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:MODEL,max_tokens:imgs.length?8000:12000,output_config:{effort:imgs.length?'medium':'high'},messages:[{role:'user',content}]})});
  }catch(e){if(e&&e.name==='AbortError')throw {code:'cancelled',message:''};throw {code:'unavailable',message:'Rete non disponibile'}}
  if(!res.ok){
    let msg='';try{const j=await res.json();msg=(j.error&&j.error.message)||''}catch(e){}
    const code=res.status===401||res.status===403||/credit/i.test(msg)?'not_granted':res.status===429||res.status===529?'rate_limited':res.status===413?'image_rejected':'api_error';
    throw {code,message:msg};
  }
  const data=await res.json();
  const text=(data.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('\n');
  if(opts.onText)opts.onText({text,delta:text});
  return {text,truncated:data.stop_reason==='max_tokens'};
}
claudeSample.json=async(input,opts)=>{
  const {text}=await claudeSample(input,opts);
  const f=text.match(/```(?:json)?\s*([\s\S]*?)```/);let s=f?f[1]:text;
  const a=s.search(/[\[{]/),b=Math.max(s.lastIndexOf('}'),s.lastIndexOf(']'));
  if(a<0||b<a)throw {code:'api_error',message:'Risposta non in JSON'};
  try{return JSON.parse(s.slice(a,b+1))}catch(e){throw {code:'api_error',message:'JSON non valido'}}
};

  const k=apiKey();
  openSheet(`<div class="sh-head"><h3>${welcome?'Benvenuto':'Impostazioni'}</h3><button class="btn ghost" data-act="close">Chiudi</button></div><div class="sh-body">
    ${welcome?'<p>Per partire importa il file dei tuoi dati (lavagna-dati.json), poi inserisci la chiave API per leggere le foto.</p>':''}
    ${needKey?'<div class="card" style="border-left:4px solid var(--red)">Per leggere le foto e valutare le schede serve la chiave API di Claude.</div>':''}
    <div class="card"><h3>Chiave API Claude</h3>
      <p class="sub" style="margin:.3rem 0">Si crea su console.anthropic.com → API Keys. Resta salvata solo su questo dispositivo. Costo stimato: 2–3 centesimi a foto.</p>
      <input id="apiKeyIn" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="sk-ant-…" value="${esc(k)}">
      <div class="row" style="margin-top:.6rem"><button class="btn primary grow" id="apiSave">Salva e verifica</button>${k?'<button class="btn danger ghost" id="apiDel">Rimuovi</button>':''}</div>
      <div class="note" id="apiMsg">${k?'Chiave salvata.':'Nessuna chiave salvata.'}</div></div>
    <div class="card"><h3>Backup</h3>
      <p class="sub" style="margin:.3rem 0">I dati vivono su questo dispositivo. Esporta un backup ogni tanto e salvalo su iCloud Drive: serve anche per passare i dati tra iPhone e Mac.</p>
      <button class="btn wide" id="expAll">Esporta backup con foto</button>
      <button class="btn wide ghost" style="margin-top:.4rem" id="expLite">Esporta solo i dati</button>
      <button class="btn wide" style="margin-top:.4rem" id="impBtn">Importa backup</button>
      <input type="file" id="impIn" accept="application/json,.json" hidden>
      <div class="note">${S.sessions.length} sessioni, ${S.maxes.length} massimali, ${S.heroes.length} risultati benchmark.</div></div>
  </div>`);
  $('#apiSave').onclick=async()=>{
    const v=$('#apiKeyIn').value.trim(),m=$('#apiMsg');
    if(!v){m.textContent='Incolla la chiave.';return}
    try{localStorage.setItem(KEY_LS,v)}catch(e){m.textContent='Impossibile salvare la chiave.';return}
    m.textContent='Verifico…';
    try{await claudeSample('Rispondi solo: ok');m.textContent='Chiave valida e credito disponibile.';render()}
    catch(e){m.textContent=e.code==='not_granted'?'Chiave non valida o credito esaurito: '+(e.message||''):e.code==='unavailable'?'Rete non disponibile: la chiave è salvata, la verifico al primo uso.':'Verifica non riuscita: '+(e.message||e.code)}
  };
  if($('#apiDel'))$('#apiDel').onclick=()=>{try{localStorage.removeItem(KEY_LS)}catch(e){}openSettings(false);render()};
  $('#expAll').onclick=()=>exportBackup(true);
  $('#expLite').onclick=()=>exportBackup(false);
  $('#impBtn').onclick=()=>$('#impIn').click();
  $('#impIn').onchange=e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(f)importBackup(f)};
}

/* ---------- Boot ---------- */
$('#today').textContent=dLong(todayISO());
sampleFn=claudeSample;sampleReady=true;imgReady=true;imgMax=5;assetsApi=localAssets;
Store.loadLocal();render();
$('#gear').addEventListener('click',()=>openSettings(false));
new MutationObserver(hydratePhotos).observe(document.body,{childList:true,subtree:true});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
if(!S.sessions.length&&!S.maxes.length)setTimeout(()=>openSettings(false,true),400);
})();
</script>
</body>
</html>
